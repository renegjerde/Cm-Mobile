function matchFitnessRisk(p){

function chooseInjuryDuration(p){

function registerYellowCard(p,round){

 const thresholds=[{cards:5,lastRound:19,ban:1},{cards:10,lastRound:32,ban:2},{cards:15,lastRound:38,ban:3}];
 for(const t of thresholds){
  if(d.yellow>=t.cards&&round<=t.lastRound&&!d.sanctions.includes(t.cards)){
   d.sanctions.push(t.cards);
   p.suspended=Math.max(p.suspended||0,t.ban);
   d.ban=Math.max(d.ban||0,t.ban);
   d.banIssuedRound=round;
   appState.log.push(`${p.name} har nådd ${t.cards} gule kort og får ${t.ban} kamp${t.ban===1?"":"er"} karantene (Premier League-regler).`);

function recoverSquadBeforeRound(){

 if(appState.lastRecoveryRound!==null){
  appState.squad.forEach(p=>{
   if((p.injured||0)>0)p.injured=Math.max(0,p.injured-1);
   const d=disciplineRecord(p);
   // A ban issued in the immediately preceding round must still apply to this round.
   if((p.suspended||0)>0&&d.banIssuedRound<appState.week-1)p.suspended=Math.max(0,p.suspended-1);
   if((d.ban||0)>0&&d.banIssuedRound<appState.week-1)d.ban=Math.max(0,d.ban-1);
  });
 }

function selectionScore(p){

  :p.pos==="DEF"?(a.defending*.42+a.strength*.18+a.pace*.12+a.stamina*.14+a.passing*.14)
  :p.pos==="MID"?(a.passing*.25+a.creativity*.24+a.technique*.18+a.stamina*.20+a.pace*.08+a.defending*.05)

function buildRecommendedXI(formation){

 for(const pos of ["GK","DEF","MID","ATT"]){

 while(xi.length<11){const p=available.filter(x=>!xi.some(q=>String(q.id)===String(x.id))).sort((a,b)=>selectionScore(b)-selectionScore(a))[0];if(!p)break;xi.push(p)}

function ensureFixtures(){

  const fixed=arr[0], rest=arr.slice(1);rest.unshift(rest.pop());arr=[fixed,...rest];
 }

 appState.fixtures=[...rounds,...second].map((games,i)=>({round:i+1,games,played:false}));

function createMatchLineup(players,formation,teamName){

  const n=counts[pos]||0;
  const pool=p.filter(x=>x.pos===pos&&!xi.some(y=>y.id===x.id));
  xi.push(...pool.slice(0,n));
 }

function simulateMatch(powerA,powerB,homeA,playersA=[],playersB=[],formationA="4-3-3",formationB="4-3-3",mentalityA="Balanced",mentalityB="Balanced"){
 const xiA=assignTacticalRoles(createMatchLineup(playersA,formationA,"A"),formationA),xiB=assignTacticalRoles(createMatchLineup(playersB,formationB,"B"),formationB);
 const tactical={Defensive:-1.6,Balanced:0,Attacking:1.6,"High press":1.1};
 const mentalA=tactical[mentalityA]||0, mentalB=tactical[mentalityB]||0;
 const avg=xi=>xi.length?xi.reduce((s,p)=>s+p.rating,0)/xi.length:65;
 const gkA=xiA.find(p=>p.pos==="GK")?.rating||65,gkB=xiB.find(p=>p.pos==="GK")?.rating||65;
 const attackA=avg(xiA.filter(p=>p.pos==="ATT"||p.pos==="MID"))+mentalA+(homeA?1.8:0);
 const attackB=avg(xiB.filter(p=>p.pos==="ATT"||p.pos==="MID"))+mentalB+(homeA?0:1.8);
 const defenseA=avg(xiA.filter(p=>p.pos==="DEF"))+gkA*.22;
 const defenseB=avg(xiB.filter(p=>p.pos==="DEF"))+gkB*.22;
 const events=[],stats={shotsA:0,shotsB:0,onA:0,onB:0,possessionA:50,bigA:0,bigB:0};
 let scoreA=0,scoreB=0;
 const minute=()=>1+Math.floor(Math.random()*90);
 const scorerFor=(xi,side)=>{
  const candidates=xi.filter(p=>p.pos==="ATT"||p.pos==="MID");
  const picked=weightedPick(candidates,candidates.map(p=>Math.max(1,p.rating-45)*(p.pos==="ATT"?1.6:p.pos==="MID"?0.85:0.2)));
  if(picked)return {name:picked.name,id:picked.id};
  return {name:side==="A"?"Angriper":"Spiss",id:null};
 };
 const assistantFor=(xi,scorerId)=>{
  const candidates=xi.filter(p=>p.id!==scorerId&&(p.pos==="MID"||p.pos==="ATT"));

  return picked?picked.name:null;
 };
 const chanceList=[];
 // Minute-by-minute chance generation. Goal probability depends on chance quality, finishing,
 // relative attack/defence and goalkeeper strength.
 for(let m=1;m<=90;m++){
  const chancesThisMinute=(Math.random()<0.19?1:0)+(Math.random()<0.018?1:0);
  for(let k=0;k<chancesThisMinute;k++){
   const side=Math.random()<Math.max(.22,Math.min(.78,.5+(attackA-defenseB-(attackB-defenseA))*.012))?"A":"B";
   const xi=side==="A"?xiA:xiB, attack=side==="A"?attackA:attackB, defence=side==="A"?defenseB:defenseA, keeper=side==="A"?gkB:gkA;
   const attackers=xi.filter(p=>p.pos==="ATT"||p.pos==="MID");
   const shooter=weightedPick(attackers,attackers.map(p=>Math.max(1,p.rating-45)*(p.pos==="ATT"?1.6:p.pos==="MID"?.75:0.15)));
   const finishing=shooter?shooter.rating:65;
   const quality=Math.max(.025,Math.min(.85,.12+(attack-defence)*.009+(finishing-65)*.006+(Math.random()*.22)));
   const onTarget=Math.random()<Math.max(.12,Math.min(.82,.28+(finishing-60)*.012));
   if(side==="A"){stats.shotsA++;if(onTarget)stats.onA++}else{stats.shotsB++;if(onTarget)stats.onB++}
   const savedByKeeper=Math.max(.05,Math.min(.75,.32+(keeper-65)*.012));
   const scored=onTarget&&Math.random()<quality*(1-savedByKeeper)*2.5;
   let event={minute:m,side,type:"chance",player:shooter?.name||"Angriper",onTarget,quality:+quality.toFixed(2)};
   if(scored){
    scoreA+=side==="A"?1:0;scoreB+=side==="B"?1:0;
    const scorer=scorerFor(xi,side);
    const scorerObj=shooter?{name:shooter.name,id:shooter.id}:scorer;
    const assist=assistantFor(xi,scorerObj.id);
    event={minute:m,side,type:"goal",scorer:scorerObj.name,scorerId:scorerObj.id,assist,score:`${scoreA}–${scoreB}`,onTarget:true,quality:+quality.toFixed(2)};
   }
   chanceList.push(event);
  }
  const incident=(type,prob,reason)=>{if(Math.random()>=prob)return;const side=Math.random()<.5?"A":"B",xi=side==="A"?xiA:xiB;const candidates=xi.filter(p=>p.pos!=="GK");const player=weightedPick(candidates,candidates.map(p=>Math.max(1,(p.attributes?.defending||p.rating||60)-35)));events.push({minute:m,side,type,player:player?.name||"Spiller",playerId:player?.id??null,reason});};
  incident("yellow",.006,"Gult kort");
  incident("red",.0015,"Rødt kort");
  incident("injury",.0018,"Skade");
 }
 events.push(...chanceList.filter(e=>e.type==="goal"));

 return {ga:scoreA,gb:scoreB,events,stats,xiA,xiB,chanceList,attackA,attackB,defenseA,defenseB};
}

function playerMoraleValue(p){return clamp(Number(p.morale??75),0,100)}

function matchStamina(engine,p){
 const start=engine.stamina[String(p.id)]??playerFitnessValue(p);
 return clamp(start,35,100);
}
function effectivePlayerRating(engine,p){
 ensurePlayerAttributes(p);
 const a=p.attributes;
 const skill=p.pos==="GK"?(a.handling*.30+a.reflexes*.34+a.positioning*.22+a.passing*.06+a.strength*.04)
  :p.pos==="DEF"?(a.defending*.34+a.strength*.15+a.pace*.13+a.stamina*.12+a.passing*.10+a.technique*.08+a.positioning*.08)
  :p.pos==="MID"?(a.passing*.22+a.technique*.18+a.creativity*.20+a.stamina*.15+a.pace*.10+a.defending*.08+a.finishing*.07)
  :(a.finishing*.30+a.pace*.20+a.technique*.15+a.creativity*.12+a.strength*.08+a.stamina*.10+a.passing*.05);
 const form=(playerFormValue(p)-6.5)*1.15;
 const morale=(playerMoraleValue(p)-70)*0.045;
 const fitness=(playerFitnessValue(p)-80)*0.035;
 const stamina=(matchStamina(engine,p)-75)*0.11;
 const outOfPosition=rolePenalty(p,p.assignedRole||p.role||defaultRoleFor(p.name,p.pos,0));
 return clamp(p.rating*.52+skill*.48+form+morale+fitness+stamina-outOfPosition,25,100);
}
function roleWeight(p,kind,formation){
 const pos=p.pos;
 if(kind==="attack"){
  let w=pos==="ATT"?1.29:pos==="MID"?0.88:pos==="DEF"?0.20:0.03;
  if(formation==="4-4-2"&&pos==="ATT")w=1.36;
  if(formation==="4-3-3"&&pos==="ATT")w=1.42;
  if(formation==="3-5-2"&&pos==="MID")w=1.0;
  if(formation==="4-2-3-1"&&pos==="MID")w=1.0;
  return w;
 }
 if(kind==="defense")return pos==="GK"?1.15:pos==="DEF"?1.2:pos==="MID"?.58:.18;
 return 1;
}
function weightedTeamRating(engine,side,kind){
 const xi=side==="A"?engine.xiA:engine.xiB;
 const formation=side==="A"?engine.formationA:engine.formationB;
 let total=0,weights=0;
 for(const p of xi){
  const w=roleWeight(p,kind,formation);
  total+=effectivePlayerRating(engine,p)*w;weights+=w;
 }
 return weights?total/weights:65;
}
function tacticalShapeBonus(engine,side,kind){
 const formation=side==="A"?engine.formationA:engine.formationB;
 if(kind==="attack")return formation==="4-3-3"?1.1:formation==="3-5-2"?.45:formation==="4-2-3-1"?.65:0;
 if(kind==="defense")return formation==="3-5-2"?.9:formation==="4-2-3-1"?.45:formation==="4-4-2"?.2:0;
 return 0;
}
function averageRating(players,filter){const list=players.filter(filter);return list.length?list.reduce((s,p)=>s+p.rating,0)/list.length:65}

 const userIsA=a===appState.club;
 const stamina={};

 const engine={
  a,b,homeUser,userIsA,playersA,playersB,xiA,xiB,formationA,formationB,ga:0,gb:0,events:[],
  stats:{shotsA:0,shotsB:0,onA:0,onB:0,possessionA:50},
  stamina,lastPossession:50,userSubs:0,userSubWindows:0,lastSubMinute:-1,subbedOutIds:[],minute:0,
  appearances:Object.fromEntries([...xiA,...xiB].filter(p=>p.id!=null).map(p=>[String(p.id),{player:p,start:0,end:90,started:true}])),
  performance:Object.fromEntries([...xiA,...xiB].filter(p=>p.id!=null).map(p=>[String(p.id),{influence:0,events:0,shots:0,goals:0,assists:0}]))

function liveTacticDelta(engine,side){
 const isUser=(side==='A'?engine.a:engine.b)===appState.club;
 if(!isUser)return 0;
 return ({Defensive:-2.2,Balanced:0,Attacking:2.2,'High press':1.5})[appState.tactic]||0;
}
function recomputeLiveTeam(engine,side){
 const familiarity=side==="A"?(engine.a===appState.club?formationFamiliarity(engine.formationA):20):(engine.b===appState.club?formationFamiliarity(engine.formationB):20);
 const cohesion=(side==="A"&&engine.a===appState.club)||(side==="B"&&engine.b===appState.club)?Number(appState.teamCohesion??25):20;
 const chemistryBonus=(familiarity-20)*0.035+(cohesion-25)*0.025;
 const attack=weightedTeamRating(engine,side,"attack")+tacticalShapeBonus(engine,side,"attack")+chemistryBonus;
 const defense=weightedTeamRating(engine,side,"defense")+tacticalShapeBonus(engine,side,"defense")+chemistryBonus;
 if(side==="A"){engine.baseAttackA=attack;engine.defenseA=defense}
 else{engine.baseAttackB=attack;engine.defenseB=defense}
}

function liveMatchRating(engine,p){
 const perf=engine.performance?.[String(p.id)]||{influence:0,events:0,shots:0,goals:0,assists:0};
 const minutes=Math.max(1,Math.min(90,(engine.minute||0)-(engine.appearances?.[String(p.id)]?.start||0)));
 const stamina=matchStamina(engine,p);
 let score=6.15+(effectivePlayerRating(engine,p)-p.rating)*0.055+(stamina-70)*0.012;
 score+=Math.min(1.25,(perf.goals||0)*0.85+(perf.assists||0)*0.55);
 score+=Math.min(.25,(perf.shots||0)*.05);
 if(p.pos==='GK'&&perf.events)score+=Math.min(.25,perf.events*.04);
 return Math.max(4.5,Math.min(9.8,score));
}
function assistantAutoSubs(engine,minute){
 if(!engine||!appState.autoSubs||minute<55||engine.userSubs>=5||engine.userSubWindows>=3)return;
 const trigger=[60,70,80].find(m=>m===minute);
 if(!trigger||engine.autoSubWindowsUsed?.includes(trigger))return;
 if(!engine.autoSubWindowsUsed)engine.autoSubWindowsUsed=[];
 engine.autoSubWindowsUsed.push(trigger);
 const xi=engine.userIsA?engine.xiA:engine.xiB;
 const onPitch=new Set(xi.map(p=>String(p.id)));
 const outgoingCandidates=xi.filter(p=>p.pos!=='GK'&& !engine.subbedOutIds?.some(id=>String(id)===String(p.id))).map(p=>({p,grade:liveMatchRating(engine,p),stamina:matchStamina(engine,p)})).sort((a,b)=>((a.grade-6.2)*1.15+(a.stamina-60)*.025)-((b.grade-6.2)*1.15+(b.stamina-60)*.025));
 let done=0;
 for(const item of outgoingCandidates){
  if(done>=2||engine.userSubs>=5||engine.userSubWindows>=3)break;
  const out=item.p;
  if(item.grade>=6.15&&item.stamina>=48)continue;
  const bench=appState.squad.filter(p=>!onPitch.has(String(p.id))&&!engine.subbedOutIds?.some(id=>String(id)===String(p.id))&&(p.injured||0)<=0&&(p.suspended||0)<=0&&p.pos===out.pos).sort((a,b)=>effectivePlayerRating(engine,b)-effectivePlayerRating(engine,a));
  const incoming=bench[0];if(!incoming)continue;
  const xiIndex=xi.findIndex(p=>String(p.id)===String(out.id));if(xiIndex<0)continue;
  const currentWindow=engine.lastSubWindowKey===Math.floor(trigger/5);
  if(!currentWindow){engine.userSubWindows++;engine.lastSubWindowKey=Math.floor(trigger/5);engine.lastSubMinute=minute;}
  engine.subbedOutIds.push(out.id);xi[xiIndex]=incoming;onPitch.delete(String(out.id));onPitch.add(String(incoming.id));
  engine.stamina[String(incoming.id)]=clamp(88+(playerFitnessValue(incoming)-80)*.25,78,100);
  engine.performance[String(incoming.id)]={influence:0,events:0,shots:0,goals:0,assists:0};
  const oldAppearance=engine.appearances[String(out.id)];if(oldAppearance)oldAppearance.end=minute;

  engine.userSubs++;done++;
  const container=document.getElementById('liveEvents');if(container){const row=document.createElement('div');row.className='match-event live-event-new sub-event';row.innerHTML=`<div class="event-min">${minute}'</div><div class="event-symbol">🔁</div><div class="event-detail"><strong>${esc(incoming.name)} inn for ${esc(out.name)}</strong><small>Assistentbytte · Kampkarakter ${liveMatchRating(engine,out).toFixed(1)} · ${Math.round(matchStamina(engine,out))}% utholdenhet</small></div>`;container.appendChild(row);}
  const commentary=document.getElementById('liveCommentary');if(commentary)commentary.textContent=`Assistenten bytter: ${incoming.name} erstatter ${out.name}.`;
 }
 if(done){recomputeLiveTeam(engine,engine.userIsA?'A':'B');refreshSubOptions(engine);renderLiveLineup(engine,minute,document.getElementById('liveScore')?.textContent||`${engine.ga} – ${engine.gb}`);}
}

function advanceLiveEngine(engine,minute){
 const events=[];engine.minute=minute;
 // Match stamina falls gradually; pressing and high-tempo tactics cost more energy.
 for(const side of ["A","B"]){
  const xi=side==="A"?engine.xiA:engine.xiB;
  const isUser=(side==="A"?engine.a:engine.b)===appState.club;
  const tactic=isUser?appState.tactic:"Balanced";
  const pressCost=tactic==="High press"?.19:tactic==="Attacking"?.13:tactic==="Defensive"?.07:.10;
  for(const p of xi){
   const id=String(p.id);
   const posCost=p.pos==="MID"?.10:p.pos==="ATT"?.085:p.pos==="DEF"?.075:.045;
   engine.stamina[id]=clamp((engine.stamina[id]??playerFitnessValue(p))-pressCost-posCost-(Math.random()*.035),35,100);
   const perf=engine.performance[id];if(perf)perf.influence+=effectivePlayerRating(engine,p)/100;
  }
 }
 // Recalculate ratings every minute so fatigue, morale, form and substitutions alter the balance.
 recomputeLiveTeam(engine,"A");recomputeLiveTeam(engine,"B");
 const attackA=engine.baseAttackA+liveTacticDelta(engine,"A");
 const attackB=engine.baseAttackB+liveTacticDelta(engine,"B");
 const diff=(attackA-engine.defenseB)-(attackB-engine.defenseA);
 const probA=clamp(.5+diff*.012,.2,.8);
 const chances=(Math.random()<.22?1:0)+(Math.random()<.025?1:0);
 const scorerFor=(xi,side)=>{
  const candidates=xi.filter(p=>p.pos==="ATT"||p.pos==="MID");
  if(!candidates.length)return {name:"Spiller",id:null};
  const weights=candidates.map(p=>Math.max(1,effectivePlayerRating(engine,p)-42)*roleWeight(p,"attack",side==="A"?engine.formationA:engine.formationB));
  const chosen=weightedPick(candidates,weights);
  return chosen?{name:chosen.name,id:chosen.id}:{name:"Spiller",id:null};
 };
 const assistFor=(xi,id,side)=>{const candidates=xi.filter(p=>p.id!==id&&(p.pos==="MID"||p.pos==="ATT"));const p=weightedPick(candidates,candidates.map(x=>Math.max(1,effectivePlayerRating(engine,x)-42)));return p?.name||null};
 for(let i=0;i<chances;i++){
  const side=Math.random()<probA?"A":"B";
  const xi=side==="A"?engine.xiA:engine.xiB;
  const opponentXi=side==="A"?engine.xiB:engine.xiA;
  const keeper=opponentXi.find(p=>p.pos==="GK");
  const keeperRating=keeper?effectivePlayerRating(engine,keeper):65;
  const attackers=xi.filter(p=>p.pos==="ATT"||p.pos==="MID");
  const formation=side==="A"?engine.formationA:engine.formationB;
  const shooter=weightedPick(attackers,attackers.map(p=>Math.max(1,effectivePlayerRating(engine,p)-42)*roleWeight(p,"attack",formation)));
  const finishing=shooter?effectivePlayerRating(engine,shooter):65;
  const teamAttack=side==="A"?attackA:attackB, opponentDefense=side==="A"?engine.defenseB:engine.defenseA;
  const quality=clamp(.14+(teamAttack-opponentDefense)*.005+(finishing-65)*.003+Math.random()*.14,.035,.52);
  const onTarget=Math.random()<clamp(.31+(finishing-60)*.012,.16,.82);
  if(side==="A"){engine.stats.shotsA++;if(onTarget)engine.stats.onA++}else{engine.stats.shotsB++;if(onTarget)engine.stats.onB++}
  const event={minute,side,type:"chance",player:shooter?.name||"Angriper",playerId:shooter?.id||null,onTarget,quality:+quality.toFixed(2)};
  if(shooter&&engine.performance[String(shooter.id)])engine.performance[String(shooter.id)].shots++;
  const keeperSave=clamp(.32+(keeperRating-65)*.012,.08,.72);
  if(onTarget&&Math.random()<quality*(1-keeperSave)*1.35){
   const scorer=shooter?{name:shooter.name,id:shooter.id}:scorerFor(xi,side);
   if(side==="A")engine.ga++;else engine.gb++;
   event.type="goal";event.scorer=scorer.name;event.scorerId=scorer.id;event.assist=assistFor(xi,scorer.id,side);event.score=`${engine.ga}–${engine.gb}`;
   if(scorer.id!=null&&engine.performance[String(scorer.id)])engine.performance[String(scorer.id)].goals++;
   if(event.assist){const assister=xi.find(p=>p.name===event.assist);if(assister&&engine.performance[String(assister.id)])engine.performance[String(assister.id)].assists++}
  }
  engine.events.push(event);events.push(event);
 }
 if(Math.random()<.008){

    const playedMinutes=appearance?Math.max(0,Math.min(90,Math.min(90,currentMinute)-appearance.start,appearance.end-appearance.start)):0;
    if(playedMinutes>0){
     p.apps=(p.apps||0)+1;p.minutes=(p.minutes||0)+playedMinutes;
     const matchLoad=playedMinutes/90;
     const finalStamina=engine.stamina[String(p.id)]??75;
     const fatigue=Math.max(1,Math.round(matchLoad*(100-finalStamina)*.16+matchLoad*2));
     p.fitness=Math.max(35,Math.min(100,p.fitness-fatigue));
     const perf=engine.performance[String(p.id)];
     const impact=perf?Math.min(.35,perf.goals*.22+perf.assists*.14+perf.shots*.015):0;
     const resultMood=margin>0?.18:margin<0?-.20:.02;
     p.form=Math.max(4,Math.min(10,(p.form||6.5)+resultMood+impact+(Math.random()*.18-.09)));
     p.morale=Math.max(0,Math.min(100,(p.morale??75)+(margin>0?2:margin<0?-2:0)+(perf&&perf.goals>0?1:0)));
    }else{
     // Players who did not feature recover between matches instead of losing fitness.
     p.fitness=Math.min(100,playerFitnessValue(p)+5);
    }
    if(p.age<=23&&p.rating<p.potential&&Math.random()<.08){p.rating++;appState.log.push(`${p.name} har utviklet seg og økt ferdigheten til ${p.rating}.`)}
   });
   for(const e of engine.events){
    const own=(e.side==='A'?engine.a:engine.b)===appState.club;
    if(own&&e.type==='goal'&&e.scorerId){const p=appState.squad.find(x=>x.id===e.scorerId);if(p)p.goals=(p.goals||0)+1;if(e.assist){const ap=appState.squad.find(x=>x.name===e.assist);if(ap)ap.assists=(ap.assists||0)+1}}
    if(own&&e.type==='injury'){const p=appState.squad.find(x=>x.id===e.playerId);if(p)p.injured=1+Math.floor(Math.random()*3)}
    if(own&&e.type==='red'){const p=appState.squad.find(x=>x.id===e.playerId);if(p)p.suspended=1}
   }
   const lines=margin>0?['Tre poeng!','En sterk lagprestasjon!','Jobben er gjort!']:margin===0?['Delt poeng.','En jevn kamp ender uavgjort.','Ingen klarte å vippe det i sin favør.']:['Tap i dag.','Det glapp på små marginer.','Vi må slå tilbake neste kamp.'];
   headline.textContent=lines[Math.floor(Math.random()*lines.length)];
   commentary.textContent=`Sluttsignal! ${homeName} ${currentHome}–${currentAway} ${awayName}.`;
   score.textContent=`${currentHome} – ${currentAway}`;progress.style.width='100%';
   // Keep final statistics in the same home-away order as the score, and enforce
   // the match invariant that goals cannot exceed shots on target or total shots.
   engine.stats.onA=Math.max(engine.stats.onA,engine.ga);
   engine.stats.onB=Math.max(engine.stats.onB,engine.gb);
   engine.stats.shotsA=Math.max(engine.stats.shotsA,engine.stats.onA);
   engine.stats.shotsB=Math.max(engine.stats.shotsB,engine.stats.onB);
   shots.textContent=`${engine.stats.shotsA} – ${engine.stats.shotsB}`;
   onTarget.textContent=`${engine.stats.onA} – ${engine.stats.onB}`;
   possession.textContent=`${Math.round(engine.stats.possessionA)}% – ${100-Math.round(engine.stats.possessionA)}%`;
   goalLabel.textContent=`${goalCount} mål`;finalSection.style.display='block';
   const finalText=finalSection.querySelector('p');if(finalText)finalText.textContent=resultText;
   const continueBtn=finalSection.querySelector('button');if(continueBtn){continueBtn.textContent=seasonCompleted()?'Se sesongoppsummering →':'Fortsett →';continueBtn.setAttribute('onclick',`setPage('${seasonCompleted()?'season':'home'}')`)}
   if(saveButton)saveButton.disabled=false;
   save();
   const btn=finalSection.querySelector('button');if(btn)btn.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
 };
 pauseBtn.addEventListener("click",()=>{
  if(matchFinished)return;
  paused=!paused;
  pauseBtn.textContent=paused?"▶ Fortsett":"Ⅱ Pause";
  pauseBtn.classList.toggle("live-paused",paused);
  status.textContent=paused?`PAUSE · ${currentMinute}'`:`LIVE · ${currentMinute}'`;
  if(paused){if(timer)clearInterval(timer);timer=null;}
  else{timer=setInterval(clockTick,tickMs);}
 });
 controls.querySelectorAll("button[data-speed]").forEach(btn=>{
  btn.addEventListener("click",()=>{
   tickMs=Number(btn.dataset.speed)||300;
   controls.querySelectorAll("button[data-speed]").forEach(b=>b.setAttribute("aria-pressed",String(b===btn)));
   speedLabel.textContent=`Tempo · ${{600:"1×",300:"2×",150:"4×"}[tickMs]||"2×"}`;
   if(!paused&&!matchFinished){if(timer)clearInterval(timer);timer=setInterval(clockTick,tickMs);}
  });
 });
 const tacticSelect=document.getElementById('liveTacticSelect');
 tacticSelect.value=appState.tactic;
 tacticSelect.addEventListener('change',()=>{
  appState.tactic=tacticSelect.value;
  const labels={Defensive:'Defensiv',Balanced:'Balansert',Attacking:'Offensiv','High press':'Høyt press'};
  const sub=document.getElementById('liveSub');if(sub)sub.textContent=`${home?'Hjemmekamp på eget gress':'På bortebane'} · Taktikk: ${labels[appState.tactic]||appState.tactic}`;
  commentary.textContent=`Taktikken endres til ${labels[appState.tactic]||appState.tactic}. Laget justerer seg.`;
 });
 const openLineupNow=()=>{
  const modal=document.getElementById('lineupModal');if(!modal||matchFinished)return;
  if(!paused){paused=true;if(timer)clearInterval(timer);timer=null;pauseBtn.textContent='▶ Fortsett';pauseBtn.classList.add('live-paused');status.textContent=`PAUSE · ${currentMinute}'`;}
  modal.classList.add('open');
  renderLiveLineup(engine,currentMinute,score.textContent);
  refreshSubOptions(engine);
 };
 const closeLineupNow=()=>{
  const modal=document.getElementById('lineupModal');if(modal)modal.classList.remove('open');
  if(!matchFinished&&paused){paused=false;pauseBtn.textContent='Ⅱ Pause';pauseBtn.classList.remove('live-paused');status.textContent=`LIVE · ${currentMinute}'`;timer=setInterval(clockTick,tickMs);}
 };
 const makeSubBtn=document.getElementById('makeSubBtn');
 if(makeSubBtn)makeSubBtn.addEventListener('click',()=>makeLiveSubstitution(engine,currentMinute));
 const subOutSelect=document.getElementById('subOut');if(subOutSelect)subOutSelect.addEventListener('change',()=>refreshSubOptions(engine));
 const autoSubsToggle=document.getElementById('autoSubsToggle');if(autoSubsToggle)autoSubsToggle.addEventListener('change',()=>{appState.autoSubs=autoSubsToggle.checked;save();});
 const openLineupBtn=document.getElementById('openLineupBtn');if(openLineupBtn)openLineupBtn.addEventListener('click',openLineupNow);
 const closeLineupBtn=document.getElementById('closeLineupBtn');if(closeLineupBtn)closeLineupBtn.addEventListener('click',closeLineupNow);
 const closeLineupContinue=document.getElementById('closeLineupContinue');if(closeLineupContinue)closeLineupContinue.addEventListener('click',closeLineupNow);
 refreshSubOptions(engine);
 renderLiveLineup(engine,currentMinute,score.textContent);
 timer=setInterval(clockTick,tickMs);
}
function setPage(p){appState.page=p;render()}
function render(){ensureFixtures();document.getElementById("topSeason").textContent=`TOUCHLINE EDITION · v1.31 · ${seasonLabel()} · ${seasonCompleted()?"SESONGSLUTT":"RUNDE "+appState.week}`;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===appState.page));let pages={home,squad,tactics,transfers,league,season:seasonSummary};document.getElementById("app").innerHTML=pages[appState.page]();save()}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));
document.getElementById("saveBtn").addEventListener("click",()=>{save();let b=document.getElementById("saveBtn");b.textContent="✓ Lagret";setTimeout(()=>b.textContent="▣ Lagre",1200)});
if(!load()){init()}else{render()}
</script>
</body></html>
