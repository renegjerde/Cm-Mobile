<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101b2b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CM Mobile — Touchline</title>
<style>
:root{--bg:#0b1220;--panel:#121e30;--panel2:#18273b;--line:#293a50;--text:#edf4fb;--muted:#9eb0c4;--green:#8edb77;--gold:#f3ca72;--red:#f08080;--blue:#72b7f4}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#101b2b,#09111e 65%);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#20324a;color:var(--text)}button.primary{background:var(--green);border-color:var(--green);color:#102014;font-weight:800}button.ghost{background:transparent}button:disabled{opacity:.45;cursor:not-allowed}
header{position:sticky;top:0;z-index:5;background:#101b2bf2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) 14px 12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:900;letter-spacing:.12em;font-size:13px}.brand span{color:var(--green)}.season{font-size:11px;color:var(--muted)}
main{max-width:760px;margin:auto;padding:14px 12px 92px}.hero{border:1px solid #31465f;background:linear-gradient(135deg,#1d344a,#142236 65%,#1b382c);border-radius:16px;padding:17px;margin-bottom:13px;position:relative;overflow:hidden}.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:800}.hero h1{font-size:25px;line-height:1.1;margin:8px 0}.hero p{color:#c2d0df;margin:0 0 14px;max-width:460px}.hero-actions{display:flex;gap:8px;flex-wrap:wrap}.hero-mark{position:absolute;right:-10px;top:12px;font-size:94px;opacity:.10}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:13px}.stat,.card{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:13px}.stat small,.muted{color:var(--muted)}.stat strong{display:block;font-size:22px;margin-top:3px}.stat .positive{color:var(--green)}.stat .warning{color:var(--gold)}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px}.section-title h2{font-size:15px;margin:0}.section-title small{color:var(--muted)}
.card{margin-bottom:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.club{display:flex;align-items:center;gap:10px}.crest{width:42px;height:42px;border-radius:12px;background:#263a50;display:grid;place-items:center;font-size:20px;border:1px solid #40546a}.club h3{font-size:16px;margin:0}.club p{font-size:12px;color:var(--muted);margin:2px 0 0}.pill{font-size:10px;border-radius:20px;padding:4px 7px;background:#25394d;color:#c6d7e7;white-space:nowrap}.pill.green{color:var(--green);background:#1d392c}
.nav{position:fixed;z-index:8;bottom:0;left:0;right:0;display:flex;justify-content:space-around;gap:2px;padding:8px 4px calc(8px + env(safe-area-inset-bottom));background:#0d1726f5;border-top:1px solid var(--line);backdrop-filter:blur(14px)}.nav button{flex:1;background:transparent;border:0;padding:7px 2px;color:var(--muted);font-size:10px}.nav button b{display:block;font-size:18px;font-weight:500;margin-bottom:2px}.nav button.active{color:var(--green)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}th,td{text-align:right;padding:10px 9px;border-bottom:1px solid #26364a}th{color:var(--muted);font-weight:600;background:#17263a}th:nth-child(2),td:nth-child(2){text-align:left}tr:last-child td{border-bottom:0}.you{background:#1d352c}.you td:nth-child(2){color:var(--green);font-weight:800}
.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}.tabs button{white-space:nowrap}.tabs button.active{border-color:var(--green);color:var(--green);background:#1a3029}
.player{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 0;border-bottom:1px solid #26364a}.player:last-child{border-bottom:0}.player-name{font-weight:750}.player-meta{font-size:11px;color:var(--muted);margin-top:3px}.rating{font-weight:900;color:var(--green);font-size:16px}.attrs{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.attr{font-size:10px;background:#1e3045;padding:3px 6px;border-radius:5px;color:#bfd0e1}
select{background:#1c2d42;color:var(--text);border:1px solid var(--line);padding:10px;border-radius:9px;max-width:100%}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:11px;color:var(--muted)}.field select{width:100%}
.fixture{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid #26364a}.fixture:last-child{border-bottom:0}.fixture .team{flex:1}.fixture .team:last-child{text-align:right}.score{font-weight:900;font-size:17px;min-width:58px;text-align:center}.result{font-size:10px;color:var(--muted);display:block}
.notice{border:1px solid #574c31;background:#30291b;color:#f3d99b;border-radius:10px;padding:10px 12px;font-size:12px;margin:12px 0}
.empty{padding:24px;text-align:center;color:var(--muted)}.footer-note{text-align:center;color:#72869c;font-size:10px;margin:22px 0}
@media(min-width:600px){main{padding:20px 18px 95px}.hero{padding:23px}.hero h1{font-size:31px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

.event-line{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid #26364a}
.event-line:last-child{border-bottom:0}
.event-minute{min-width:43px;color:var(--muted);font-weight:750;font-variant-numeric:tabular-nums}
.event-icon{width:28px;flex:0 0 28px;text-align:center;font-size:19px;line-height:1.25}
.event-copy{flex:1;min-width:0}
.event-title{font-weight:750}
.event-sub{font-size:11px;color:var(--muted);margin-top:2px}
.event-score{font-weight:900;font-size:15px;white-space:nowrap}
.card-yellow{display:inline-block;width:12px;height:17px;border-radius:2px;background:#ffd32a;box-shadow:0 0 0 1px #e8b91c}
.card-red{display:inline-block;width:12px;height:17px;border-radius:2px;background:#f04444;box-shadow:0 0 0 1px #c82727}


.match-event{display:grid;grid-template-columns:42px 26px 1fr auto;align-items:start;gap:8px;padding:10px 0;border-bottom:1px solid #26364a}
.match-event:last-child{border-bottom:0}
.event-min{font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted)}
.event-symbol{font-size:18px;text-align:center;line-height:1.25}
.event-detail{min-width:0}
.event-detail strong{display:block;font-size:13px}
.event-detail small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.player-status{display:inline-block;font-size:10px;border-radius:5px;padding:3px 6px;margin:3px 4px 0 0;background:#25394d;color:#c6d7e7}
.player-status.good{background:#1d392c;color:var(--green)}
.player-status.bad{background:#42252b;color:#ffaaaa}

</style></head>
<body>
<header><div class="top"><div><div class="brand">CM <span>MOBILE</span></div><div class="season" id="topSeason">TOUCHLINE EDITION · 2026/27</div></div><button class="ghost" id="saveBtn" title="Lagre karriere">▣ Lagre</button></div></header>
<main id="app"></main>
<nav class="nav" id="nav">
<button data-page="home" class="active"><b>⌂</b>Oversikt</button><button data-page="squad"><b>♟</b>Tropp</button><button data-page="tactics"><b>▦</b>Taktikk</button><button data-page="transfers"><b>⇄</b>Overganger</button><button data-page="league"><b>♜</b>Tabell</button>
</nav>
<script>
const CLUBS=[
{name:"Arsenal",short:"ARS",strength:84,budget:92,crest:"🔴",city:"London"},
{name:"Manchester City",short:"MCI",strength:88,budget:110,crest:"🔵",city:"Manchester"},
{name:"Liverpool",short:"LIV",strength:86,budget:95,crest:"🔴",city:"Liverpool"},
{name:"Manchester United",short:"MUN",strength:81,budget:78,crest:"🔴",city:"Manchester"},
{name:"Chelsea",short:"CHE",strength:82,budget:90,crest:"🔵",city:"London"},
{name:"Tottenham",short:"TOT",strength:80,budget:72,crest:"⚪",city:"London"},
{name:"Newcastle United",short:"NEW",strength:80,budget:70,crest:"⚫",city:"Newcastle"},
{name:"Aston Villa",short:"AVL",strength:79,budget:62,crest:"🟣",city:"Birmingham"},
{name:"Brighton",short:"BHA",strength:76,budget:48,crest:"🔵",city:"Brighton"},
{name:"West Ham",short:"WHU",strength:75,budget:45,crest:"🍷",city:"London"},
{name:"Crystal Palace",short:"CRY",strength:73,budget:38,crest:"🦅",city:"London"},
{name:"Everton",short:"EVE",strength:71,budget:28,crest:"🔵",city:"Liverpool"}
];
const names={GK:["E. Hartley","M. Kovac"],DEF:["L. Bennett","A. Silva","J. Mensah","T. Walker","P. Novak","R. Hughes"],MID:["D. Fletcher","M. Costa","A. Ibrahim","J. Clarke","S. Petrov","K. Walsh"],ATT:["A. Moreno","L. Okafor","J. Williams","N. Jensen"]};
const positions=["GK","DEF","DEF","DEF","DEF","DEF","DEF","MID","MID","MID","MID","MID","MID","ATT","ATT","ATT","ATT"];
const appState={page:"home",club:3,week:1,played:0,formation:"4-3-3",tactic:"Balanced",selectedXI:null,log:[],transferTab:"market",squad:[],table:[],budget:0,started:false};
function makeSquad(clubIndex){let c=CLUBS[clubIndex];return positions.map((pos,i)=>{let base=c.strength+(Math.random()*12-6);return {id:clubIndex*100+i+1,name:names[pos][i%(names[pos].length)],pos,age:18+Math.floor(Math.random()*17),rating:Math.max(48,Math.min(94,Math.round(base+(pos==="ATT"?2:0)))),potential:Math.max(50,Math.min(96,Math.round(base+Math.random()*13))),value:Math.max(.4,+(Math.pow(Math.max(5,base-48),2)/90*(pos==="ATT"?1.15:1)).toFixed(1)),wage:Math.round(5+base*.65),fitness:90+Math.floor(Math.random()*11),morale:70+Math.floor(Math.random()*25),goals:0,assists:0,apps:0,minutes:0,form:6.5,injured:0,suspended:0}})}
function init(){appState.squad=makeSquad(appState.club);appState.budget=CLUBS[appState.club].budget;appState.table=CLUBS.map(c=>({...c,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));appState.fixtures=[];ensureFixtures();appState.started=true;save();render()}
function save(){try{localStorage.setItem("cmMobileSave",JSON.stringify(appState));}catch(e){}}
function load(){try{let s=JSON.parse(localStorage.getItem("cmMobileSave"));if(s&&s.started){Object.assign(appState,s);if(!s.fixtures||!s.fixtures.length){appState.week=1;appState.played=0;appState.log=[];appState.table=CLUBS.map(c=>({...c,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));appState.fixtures=[];}return true}}catch(e){}return false}
function money(n){return "£"+(n<1?Math.round(n*1000)+"k":n.toFixed(1)+"m")}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function currentClub(){return CLUBS[appState.club]}
function sortedTable(){return [...appState.table].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}
function panel(title,body,right=""){return `<div class="section-title"><h2>${title}</h2>${right}</div><section class="card">${body}</section>`}
function getNextOpponentIndex(){ensureFixtures();let r=appState.fixtures.find(f=>f.round===appState.week&&!f.played);if(!r)return (appState.club+1)%CLUBS.length;let g=r.games.find(x=>x.includes(appState.club));return g?(g[0]===appState.club?g[1]:g[0]):(appState.club+1)%CLUBS.length}
function home(){let c=currentClub(),t=appState.table.find(x=>x.name===c.name),next=CLUBS[getNextOpponentIndex()];return `
<div class="hero"><div class="hero-mark">⚽</div><div class="eyebrow">Manager profile · Season 2026/27</div><h1>${c.name}</h1><p>Det er din klubb. Nå begynner jobben: bygg laget, vinn kampene og finn de spillerne ingen andre har oppdaget.</p><div class="hero-actions"><button class="primary" onclick="playMatch()">▶ Spill neste kamp</button><button onclick="setPage('squad')">Se tropp →</button><button class="ghost" onclick="chooseClub()">Bytt klubb</button></div></div>
<div class="grid"><div class="stat"><small>Ligaplass</small><strong>${sortedTable().findIndex(x=>x.name===c.name)+1}. <span class="muted" style="font-size:12px">/ ${CLUBS.length}</span></strong></div><div class="stat"><small>Poeng</small><strong>${t.pts}</strong></div><div class="stat"><small>Overgangsbudsjett</small><strong class="positive">${money(appState.budget)}</strong></div><div class="stat"><small>Spilt</small><strong>${t.p} <span class="muted" style="font-size:12px">kamper</span></strong></div></div>
${panel("Neste kamp",`<div class="row"><div class="club"><div class="crest">${c.crest}</div><div><h3>${c.name}</h3><p>Hjemmekamp · Runde ${appState.week}</p></div></div><div style="font-size:18px;color:var(--muted)">vs</div><div class="club"><div><h3 style="text-align:right">${next.name}</h3><p style="text-align:right">Motstander</p></div><div class="crest">${next.crest}</div></div></div>`)}
${panel("Siste nytt",appState.log.length?appState.log.slice(-3).reverse().map(x=>`<div class="fixture"><div class="team">${esc(x)}</div><span class="pill">NYTT</span></div>`).join(""):`<div class="muted">Ingen nyheter ennå. Første kamp venter på deg.</div>`)}
<div class="notice">Prototype v0.1: klubbene er ekte, men spillerstallen er foreløpig generert for å teste spillmekanikken. Den er ikke en offisiell eller oppdatert spillerdatabase.</div>`}
function squad(){return `<div class="hero"><div class="eyebrow">First team</div><h1>Spillertropp</h1><p>${currentClub().name} · ${appState.squad.length} spillere · Gjennomsnitt ${Math.round(appState.squad.reduce((s,p)=>s+p.rating,0)/appState.squad.length)} i ferdighet</p></div>
<div class="tabs"><button class="active">Alle spillere</button><button onclick="sortSquad('rating')">Sorter: ferdighet</button><button onclick="sortSquad('value')">Sorter: verdi</button></div><section class="card"><div class="row muted" style="font-size:10px"><span>SPILLER / POSISJON</span><span>FERDIGHET</span></div><div id="players">${appState.squad.map(playerRow).join("")}</div></section>`}
function playerRow(p){let status=p.injured>0?`<span class="player-status bad">Skadet ${p.injured} r.</span>`:p.suspended>0?`<span class="player-status bad">Suspendert</span>`:`<span class="player-status good">Tilgjengelig</span>`;return `<div class="player"><div><div class="player-name">${esc(p.name)} <span class="pill">${p.pos}</span></div><div class="player-meta">${p.age} år · Verdi ${money(p.value)} · Lønn ${money(p.wage/1000)} / uke</div><div class="attrs"><span class="attr">Form ${p.fitness}%</span><span class="attr">Moral ${p.morale}</span><span class="attr">Potensial ${p.potential}</span><span class="attr">Kampform ${Number(p.form||6.5).toFixed(1)}</span><span class="attr">${p.apps||0} kamper</span><span class="attr">${p.goals||0} mål</span><span class="attr">${p.assists||0} assist</span></div>${status}</div><div class="rating">${p.rating}</div></div>`}
function sortSquad(key){appState.squad.sort((a,b)=>b[key]-a[key]);render()}
function tactics(){
 const layouts={"4-4-2":[2,4,4,1],"4-3-3":[3,3,4,1],"4-2-3-1":[1,5,4,1],"3-5-2":[2,5,3,1]};
 const [attN,midN,defN]=layouts[appState.formation]||layouts["4-3-3"];
 const choose=(pos,n)=>{let pool=appState.squad.filter(p=>p.pos===pos).sort((a,b)=>b.rating-a.rating);return pool.slice(0,n)};
 let att=choose("ATT",attN), mid=choose("MID",midN), def=choose("DEF",defN), gk=choose("GK",1);
 let selected=[...att,...mid,...def,...gk];
 while(selected.length<11){let rest=appState.squad.filter(p=>!selected.some(q=>q.id===p.id)).sort((a,b)=>b.rating-a.rating);if(!rest.length)break;selected.push(rest[0])}
 const line=(players)=>`<div style="display:flex;justify-content:space-evenly;gap:3px;margin:12px 0">${players.map(p=>`<div style="flex:1;min-width:0;text-align:center"><div style="font-size:20px">●</div><small style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name.split(" ").slice(-1)[0])}</small></div>`).join("")}</div>`;
 return `<div class="hero"><div class="eyebrow">Match preparation</div><h1>Taktikk</h1><p>Formasjonen bestemmer hvordan de elleve spillerne plasseres. Spillernes ferdigheter og mentaliteten påvirker kampen.</p></div><section class="card"><div class="field"><label>FORMASJON</label><select id="formation" onchange="appState.formation=this.value;save();render()">${["4-4-2","4-3-3","4-2-3-1","3-5-2"].map(f=>`<option ${appState.formation===f?"selected":""}>${f}</option>`).join("")}</select></div><div class="field"><label>MENTALITET</label><select id="tactic" onchange="appState.tactic=this.value;save()">${["Defensive","Balanced","Attacking","High press"].map(f=>`<option value="${f}" ${appState.tactic===f?"selected":""}>${({Defensive:"Defensiv",Balanced:"Balansert",Attacking:"Offensiv","High press":"Høyt press"})[f]}</option>`).join("")}</select></div><div class="section-title"><h2>Forventet startellever</h2><small>${selected.length} spillere</small></div><div style="background:linear-gradient(180deg,#17452f,#123622);border:1px solid #2b6848;border-radius:12px;padding:14px;text-align:center"><div style="font-size:11px;color:#b5e6bf;margin-bottom:10px">▲ ANGREP</div>${line(att)}${line(mid)}${line(def)}<div style="margin-top:12px">🧤 ${gk.length?esc(gk[0].name):"Ingen keeper"}</div></div><p class="muted" style="font-size:11px;margin-top:12px">Spillerne velges automatisk etter posisjon og ferdighet. Neste steg er å gjøre laguttaket redigerbart.</p><button class="primary" style="width:100%" onclick="playMatch()">Bruk taktikken og spill kamp</button></section>`;
}
function transfers(){let targets=[{name:"T. Adeyemi",pos:"ATT",age:21,rating:76,potential:88,value:27.5,wage:48},{name:"M. Laurent",pos:"MID",age:19,rating:67,potential:86,value:8.5,wage:18},{name:"J. van Dijk",pos:"DEF",age:24,rating:74,potential:79,value:16,wage:35},{name:"A. Costa",pos:"GK",age:22,rating:70,potential:84,value:7.2,wage:22},{name:"R. Mensah",pos:"MID",age:28,rating:78,potential:78,value:21,wage:62}];return `<div class="hero"><div class="eyebrow">Recruitment centre</div><h1>Overgangsmarked</h1><p>Finn forsterkninger, men pass på budsjettet. Alle spillerne i denne listen er fiktive prototypedata.</p><div class="hero-actions"><span class="pill green">Budsjett ${money(appState.budget)}</span><span class="pill">Lønnskostnader kommer senere</span></div></div><section class="card">${targets.map((p,i)=>`<div class="player"><div><div class="player-name">${p.name} <span class="pill">${p.pos}</span></div><div class="player-meta">${p.age} år · Potensial ${p.potential} · Lønn ${p.wage}k/uke</div><div class="attrs"><span class="attr">Verdi ${money(p.value)}</span></div></div><div style="text-align:right"><div class="rating">${p.rating}</div><button style="margin-top:6px;padding:7px 9px" onclick="buyPlayer(${i})" ${appState.budget<p.value?"disabled":""}>By ${money(p.value)}</button></div></div>`).join("")}</section><div class="notice">Overgangene er foreløpig direkte kjøp til markedsverdi. Bud, forhandlinger, AI-klubber og kontrakter kommer i neste iterasjon.</div>`}
function buyPlayer(i){let targets=[{name:"T. Adeyemi",pos:"ATT",age:21,rating:76,potential:88,value:27.5,wage:48},{name:"M. Laurent",pos:"MID",age:19,rating:67,potential:86,value:8.5,wage:18},{name:"J. van Dijk",pos:"DEF",age:24,rating:74,potential:79,value:16,wage:35},{name:"A. Costa",pos:"GK",age:22,rating:70,potential:84,value:7.2,wage:22},{name:"R. Mensah",pos:"MID",age:28,rating:78,potential:78,value:21,wage:62}];let p={...targets[i],id:Date.now(),fitness:100,morale:80,goals:0,assists:0,apps:0,minutes:0,form:6.5,injured:0,suspended:0};if(appState.budget<p.value)return;appState.budget=+(appState.budget-p.value).toFixed(1);appState.squad.push(p);appState.log.push(`${p.name} har signert for ${currentClub().name} for ${money(p.value)}.`);save();render()}
function league(){let rows=sortedTable();return `<div class="hero"><div class="eyebrow">League centre</div><h1>Premier League</h1><p>Sesong 2026/27 · Runde ${appState.week} · ${appState.played} av 22 runder spilt</p></div><div class="table-wrap"><table><thead><tr><th>#</th><th>Klubb</th><th>K</th><th>V</th><th>U</th><th>T</th><th>MF</th><th>P</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${r.name===currentClub().name?"you":""}"><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf-r.ga}</td><td><b>${r.pts}</b></td></tr>`).join("")}</tbody></table></div><div class="notice">Tabellen oppdateres når du spiller kamper. I denne prototypen er ligaen redusert til 12 klubber for å teste kjernen raskt.</div>`}

function chooseClub(){let options=CLUBS.map((c,i)=>`${i+1}. ${c.name}`).join("\n");let answer=prompt("Velg klubb ved å skrive nummeret:\n"+options, String(appState.club+1));if(answer===null)return;let idx=Number(answer)-1;if(!Number.isInteger(idx)||idx<0||idx>=CLUBS.length){alert("Skriv et nummer fra 1 til "+CLUBS.length+".");return;}if(idx===appState.club)return;if(confirm("Bytte til "+CLUBS[idx].name+"? Dette starter en ny testkarriere.")){appState.club=idx;appState.week=1;appState.played=0;appState.log=[];init();}}

function ensureFixtures(){
 if(appState.fixtures && appState.fixtures.length) return;
 const n=CLUBS.length, teams=CLUBS.map((_,i)=>i), rounds=[];
 // Circle method, one round-robin; even team count.
 let arr=[...teams];
 for(let r=0;r<n-1;r++){
  let games=[];
  for(let i=0;i<n/2;i++){let a=arr[i],b=arr[n-1-i];if(r%2===0)games.push([a,b]);else games.push([b,a]);}
  rounds.push(games);
  const fixed=arr[0], rest=arr.slice(1);rest.unshift(rest.pop());arr=[fixed,...rest];
 }
 const second=rounds.map(games=>games.map(([a,b])=>[b,a]));
 appState.fixtures=[...rounds,...second].map((games,i)=>({round:i+1,games,played:false}));
}
function teamPower(index){
 if(index===appState.club && appState.squad.length) return appState.squad.reduce((s,p)=>s+p.rating,0)/appState.squad.length;
 return CLUBS[index].strength;
}
function eligibleSquad(players){
 return players.filter(p=>(p.injured||0)<=0&&(p.suspended||0)<=0).sort((a,b)=>{
  const posOrder={GK:0,DEF:1,MID:2,ATT:3};
  return (posOrder[a.pos]??4)-(posOrder[b.pos]??4)||b.rating-a.rating;
 });
}
function weightedPick(players,weights){
 if(!players.length)return null;
 let total=weights.reduce((s,w)=>s+w,0),r=Math.random()*total;
 for(let i=0;i<players.length;i++){r-=weights[i];if(r<=0)return players[i]}
 return players[players.length-1];
}
function createMatchLineup(players,formation,teamName){
 const p=eligibleSquad(players);
 const counts=({"4-4-2":{ATT:2,MID:4,DEF:4,GK:1},"4-3-3":{ATT:3,MID:3,DEF:4,GK:1},"4-2-3-1":{ATT:1,MID:5,DEF:4,GK:1},"3-5-2":{ATT:2,MID:5,DEF:3,GK:1}})[formation]||{"ATT":3,"MID":3,"DEF":4,"GK":1};
 const xi=[];
 for(const pos of ["GK","DEF","MID","ATT"]){
  const n=counts[pos]||0;
  const pool=p.filter(x=>x.pos===pos&&!xi.some(y=>y.id===x.id));
  xi.push(...pool.slice(0,n));
 }
 while(xi.length<11){const next=p.find(x=>!xi.some(y=>y.id===x.id));if(!next)break;xi.push(next)}
 return xi.slice(0,11);
}
function simulateMatch(powerA,powerB,homeA,playersA=[],playersB=[],formationA="4-3-3",formationB="4-3-3",mentalityA="Balanced",mentalityB="Balanced"){
 const xiA=createMatchLineup(playersA,formationA,"A"),xiB=createMatchLineup(playersB,formationB,"B");
 const tactical={Defensive:-1.6,Balanced:0,Attacking:1.6,"High press":1.1};
 const mentalA=tactical[mentalityA]||0, mentalB=tactical[mentalityB]||0;
 const avg=xi=>xi.length?xi.reduce((s,p)=>s+p.rating,0)/xi.length:65;
 const gkA=xiA.find(p=>p.pos==="GK")?.rating||65,gkB=xiB.find(p=>p.pos==="GK")?.rating||65;
 const attackA=avg(xiA.filter(p=>p.pos==="ATT"||p.pos==="MID"))+mentalA+(homeA?1.8:0);
 const attackB=avg(xiB.filter(p=>p.pos==="ATT"||p.pos==="MID"))+mentalB+(homeA?0:1.8);
 const defenseA=avg(xiA.filter(p=>p.pos==="DEF"))+gkA*.22;
 const defenseB=avg(xiB.filter(p=>p.pos==="DEF"))+gkB*.22;
 const events=[],stats={shotsA:0,shotsB:0,onA:0,onB:0,possessionA:50,bigA:0,bigB:0};
 let scoreA=0,scoreB=0;
 const minute=()=>1+Math.floor(Math.random()*90);
 const scorerFor=(xi,side)=>{
  const candidates=xi.filter(p=>p.pos==="ATT"||p.pos==="MID");
  const picked=weightedPick(candidates,candidates.map(p=>Math.max(1,p.rating-45)*(p.pos==="ATT"?1.6:p.pos==="MID"?0.85:0.2)));
  if(picked)return {name:picked.name,id:p.id};
  return {name:side==="A"?"Angriper":"Spiss",id:null};
 };
 const assistantFor=(xi,scorerId)=>{
  const candidates=xi.filter(p=>p.id!==scorerId&&(p.pos==="MID"||p.pos==="ATT"));
  const picked=weightedPick(candidates,candidates.map(p=>Math.max(1,p.rating-45)));
  return picked?picked.name:null;
 };
 const chanceList=[];
 // Minute-by-minute chance generation. Goal probability depends on chance quality, finishing,
 // relative attack/defence and goalkeeper strength.
 for(let m=1;m<=90;m++){
  const chancesThisMinute=(Math.random()<0.19?1:0)+(Math.random()<0.018?1:0);
  for(let k=0;k<chancesThisMinute;k++){
   const side=Math.random()<Math.max(.22,Math.min(.78,.5+(attackA-defenseB-(attackB-defenseA))*.012))?"A":"B";
   const xi=side==="A"?xiA:xiB, attack=side==="A"?attackA:attackB, defence=side==="A"?defenseB:defenseA, keeper=side==="A"?gkB:gkA;
   const attackers=xi.filter(p=>p.pos==="ATT"||p.pos==="MID");
   const shooter=weightedPick(attackers,attackers.map(p=>Math.max(1,p.rating-45)*(p.pos==="ATT"?1.6:p.pos==="MID"?.75:0.15)));
   const finishing=shooter?shooter.rating:65;
   const quality=Math.max(.025,Math.min(.85,.12+(attack-defence)*.009+(finishing-65)*.006+(Math.random()*.22)));
   const onTarget=Math.random()<Math.max(.12,Math.min(.82,.28+(finishing-60)*.012));
   if(side==="A"){stats.shotsA++;if(onTarget)stats.onA++}else{stats.shotsB++;if(onTarget)stats.onB++}
   const savedByKeeper=Math.max(.05,Math.min(.75,.32+(keeper-65)*.012));
   const scored=onTarget&&Math.random()<quality*(1-savedByKeeper)*2.5;
   let event={minute:m,side,type:"chance",player:shooter?.name||"Angriper",onTarget,quality:+quality.toFixed(2)};
   if(scored){
    scoreA+=side==="A"?1:0;scoreB+=side==="B"?1:0;
    const scorer=scorerFor(xi,side);
    const scorerObj=shooter?{name:shooter.name,id:shooter.id}:scorer;
    const assist=assistantFor(xi,scorerObj.id);
    event={minute:m,side,type:"goal",scorer:scorerObj.name,scorerId:scorerObj.id,assist,score:`${scoreA}–${scoreB}`,onTarget:true,quality:+quality.toFixed(2)};
   }
   chanceList.push(event);
  }
  if(Math.random()<.006)events.push({minute:m,side:Math.random()<.5?"A":"B",type:"yellow",reason:"Forseelse"});
  if(Math.random()<.0015)events.push({minute:m,side:Math.random()<.5?"A":"B",type:"red",reason:"Alvorlig forseelse"});
  if(Math.random()<.0018)events.push({minute:m,side:Math.random()<.5?"A":"B",type:"injury",reason:"Skade"});
 }
 events.push(...chanceList.filter(e=>e.type==="goal"));
 stats.possessionA=Math.max(30,Math.min(70,Math.round(50+(attackA-attackB)*.6+(homeA?3:-3))));
 return {ga:scoreA,gb:scoreB,events,stats,xiA,xiB,attackA,attackB,defenseA,defenseB};
}
function playMatch(){
 ensureFixtures();
 const round=appState.fixtures.find(f=>f.round===appState.week&&!f.played);
 if(!round){appState.log.push("Sesongen er ferdig. Neste sesong kommer i en senere versjon.");save();render();return}
 const userIndex=appState.club;
 const fixture=round.games.find(g=>g.includes(userIndex));
 const oppIndex=fixture[0]===userIndex?fixture[1]:fixture[0];
 const c=currentClub(),opp=CLUBS[oppIndex],home=fixture[0]===userIndex;
 let myPower=teamPower(userIndex);
 const mental=({Defensive:-2,Balanced:0,Attacking:2,"High press":1.4})[appState.tactic]||0;
 const formBonus=appState.squad.reduce((s,p)=>s+(p.fitness-80)*0.025,0)/Math.max(1,appState.squad.length);
 myPower+=mental+formBonus;
 const roundResults=[];
 let userMatch=null;
 for(const [a,b] of round.games){
  let pa=teamPower(a),pb=teamPower(b);
  if(a===userIndex)pa=myPower;
  if(b===userIndex)pb=myPower;
  const fakeNames=["A. Gordon","A. Isak","H. Barnes","B. Guimarães","S. Tonali","A. Murphy","J. Willock","L. Hall","N. Pope","D. Burn","K. Trippier","S. Botman","J. Murphy","M. Almirón","C. Wilson","M. Targett","R. Young","T. Doyle"];
  const makeOpponentSquad=(clubIndex)=>fakeNames.map((name,i)=>({id:`opp-${clubIndex}-${i}`,name,pos:i===8?"GK":i<2||i===14?"ATT":i<7?"MID":"DEF",rating:Math.max(45,Math.min(92,Math.round(CLUBS[clubIndex].strength+(Math.random()*12-6)))),fitness:80+Math.floor(Math.random()*20),morale:75,form:6.5,injured:0,suspended:0}));
  const playersA=a===userIndex?appState.squad:makeOpponentSquad(a);
  const playersB=b===userIndex?appState.squad:makeOpponentSquad(b);
  const sim=simulateMatch(pa,pb,true,playersA,playersB,a===userIndex?appState.formation:"4-3-3",b===userIndex?appState.formation:"4-3-3",a===userIndex?appState.tactic:"Balanced",b===userIndex?"Balanced":"Balanced");
  const [ga,gb]=[sim.ga,sim.gb];
  roundResults.push({a,b,ga,gb,events:sim.events});
  const ta=appState.table.find(x=>x.name===CLUBS[a].name),tb=appState.table.find(x=>x.name===CLUBS[b].name);
  ta.p++;tb.p++;ta.gf+=ga;ta.ga+=gb;tb.gf+=gb;tb.ga+=ga;
  if(ga>gb){ta.w++;ta.pts+=3;tb.l++}else if(ga<gb){tb.w++;tb.pts+=3;ta.l++}else{ta.d++;tb.d++;ta.pts++;tb.pts++}
  if(a===userIndex||b===userIndex){
   const userIsA=a===userIndex;
   const s=sim.stats;
   const stats={shots:userIsA?s.shotsA:s.shotsB,shotsAgainst:userIsA?s.shotsB:s.shotsA,onTarget:userIsA?s.onA:s.onB,onTargetAgainst:userIsA?s.onB:s.onA,possession:userIsA?s.possessionA:100-s.possessionA};
   userMatch={a,b,ga,gb,events:sim.events,stats,pa,pb,xiA:sim.xiA,xiB:sim.xiB};
   // Apply real match events to the user's own squad only.
   for(const ev of sim.events){
    if(ev.type==="goal"&&ev.scorerId&&String(ev.scorerId).includes("opp-")===false){
     const p=appState.squad.find(x=>x.id===ev.scorerId);if(p){p.goals=(p.goals||0)+1}
     if(ev.assist){const aPlayer=appState.squad.find(x=>x.name===ev.assist);if(aPlayer)aPlayer.assists=(aPlayer.assists||0)+1}
    }
    if(ev.side===(userIsA?"A":"B")&&ev.type==="injury"){let p=appState.squad.filter(x=>x.pos!=="GK").sort((x,y)=>x.fitness-y.fitness)[0];if(p)p.injured=1+Math.floor(Math.random()*3)}
    if(ev.side===(userIsA?"A":"B")&&ev.type==="red"){let p=appState.squad.filter(x=>x.pos!=="GK").sort((x,y)=>y.rating-x.rating)[0];if(p)p.suspended=1}
   }
  }
 }
 round.played=true;
 appState.week++;
 appState.played++;
 appState.squad.forEach(p=>{
  p.fitness=Math.max(45,p.fitness-5-Math.floor(Math.random()*6));
  if((p.injured||0)>0)p.injured=Math.max(0,p.injured-1);
  if((p.suspended||0)>0)p.suspended=Math.max(0,p.suspended-1);
  const played=(userMatch.xiA||[]).concat(userMatch.xiB||[]).some(x=>x.id===p.id);
  if(played){p.apps=(p.apps||0)+1;p.minutes=(p.minutes||0)+90;p.form=Math.max(4,Math.min(10,(p.form||6.5)+(Math.random()*.5-.2)))}
  if(p.age<=23&&p.rating<p.potential&&Math.random()<.08){p.rating++;appState.log.push(`${p.name} har utviklet seg og økt ferdigheten til ${p.rating}.`)}
 });
 const our=home?userMatch.ga:userMatch.gb, their=home?userMatch.gb:userMatch.ga;
 const userEvents=userMatch.events.map(e=>({...e,side:(e.side==="A"?(userMatch.a===userIndex?"user":"opp"):(userMatch.b===userIndex?"user":"opp"))}));
 const goalEvents=userEvents.filter(e=>e.type==="goal").map(e=>({...e,teamName:e.side==="user"?c.name:opp.name})).sort((a,b)=>a.minute-b.minute);
 const resultText=`Runde ${round.round}: ${c.name} ${our}–${their} ${opp.name} (${home?"hjemme":"borte"}).`;
 appState.log.push(resultText);
 save();
 showMatch(c,opp,our,their,home,resultText,userMatch.stats,roundResults,goalEvents,userEvents);
}
function showMatch(c,opp,our,their,home,text,stats,roundResults,goalEvents,userEvents){
 const homeName=home?c.name:opp.name, awayName=home?opp.name:c.name;
 const homeCrest=home?c.crest:opp.crest, awayCrest=home?opp.crest:c.crest;
 const homeScore=home?our:their, awayScore=home?their:our;
 const allEvents=[...userEvents].sort((a,b)=>a.minute-b.minute);
 const eventRows=allEvents.map(e=>{
   const teamName=e.side==="user"?c.name:opp.name;
   let icon=e.type==="goal"?"⚽":e.type==="yellow"?'<span class="card-yellow"></span>':e.type==="red"?'<span class="card-red"></span>':e.type==="injury"?"🩹":"🎯";
   let title=e.type==="goal"?esc(e.scorer):esc(e.player|| (e.type==="chance"?"Avslutning":"Spiller"));
   let sub=e.type==="goal"?(e.assist?"Mål · Assist: "+esc(e.assist):"Mål"):e.type==="yellow"?"Gult kort · "+esc(e.reason||"Forseelse"):e.type==="red"?"Rødt kort · "+esc(e.reason||"Utvist"):e.type==="injury"?"Skade":e.type==="chance"?(e.onTarget?"Skudd på mål":"Avslutning utenfor mål"):"Hendelse";
   if(e.type==="chance"&&!e.onTarget)return "";
   return `<div class="match-event"><div class="event-min">${e.minute}'</div><div class="event-symbol">${icon}</div><div class="event-detail"><strong>${title}</strong><small>${sub} · ${esc(teamName)}</small></div>${e.type==="goal"?`<div class="event-score">${e.score||""}</div>`:""}</div>`;
 }).filter(Boolean).join("");
 document.getElementById("app").innerHTML=`<div class="hero"><div class="eyebrow">Full time · Runde ${appState.week-1}</div><h1>${our>their?"Tre poeng!":our===their?"Delt poeng.":"Tap i dag."}</h1><p>${home?"Hjemme på eget gress":"På bortebane"} · Taktikk: ${({Defensive:"Defensiv",Balanced:"Balansert",Attacking:"Offensiv","High press":"Høyt press"})[appState.tactic]}</p></div><section class="card"><div class="row" style="padding:10px 0 18px"><div style="text-align:center;flex:1"><div class="crest" style="margin:auto">${homeCrest}</div><div style="margin-top:8px;font-weight:800">${homeName}</div></div><div style="font-size:32px;font-weight:900;white-space:nowrap">${homeScore} – ${awayScore}</div><div style="text-align:center;flex:1"><div class="crest" style="margin:auto">${awayCrest}</div><div style="margin-top:8px;font-weight:800">${awayName}</div></div></div><div class="fixture"><div class="team">Ballbesittelse</div><b>${home?stats.possession:100-stats.possession}% – ${home?100-stats.possession:stats.possession}%</b></div><div class="fixture"><div class="team">Avslutninger</div><b>${home?stats.shots:stats.shotsAgainst} – ${home?stats.shotsAgainst:stats.shots}</b></div><div class="fixture"><div class="team">Skudd på mål</div><b>${home?stats.onTarget:stats.onTargetAgainst} – ${home?stats.onTargetAgainst:stats.onTarget}</b></div><div class="section-title"><h2>Kampens hendelser</h2><small>${goalEvents.length} mål</small></div>${eventRows||`<div class="muted" style="padding:10px 0">Ingen hendelser i kampen.</div>`}<div class="section-title"><h2>Andre resultater</h2><small>Runde ${appState.week-1}</small></div>${roundResults.filter(r=>r.a!==appState.club&&r.b!==appState.club).map(r=>`<div class="fixture"><div class="team">${esc(CLUBS[r.a].name)}</div><div class="score">${r.ga}–${r.gb}</div><div class="team" style="text-align:right">${esc(CLUBS[r.b].name)}</div></div>`).join("")}<p class="muted" style="margin-top:15px">${esc(text)}</p><button class="primary" style="width:100%" onclick="setPage('home')">Fortsett →</button></section>`;
 document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));save();
}
function setPage(p){appState.page=p;render()}
function render(){ensureFixtures();document.getElementById("topSeason").textContent=`TOUCHLINE EDITION · 2026/27 · RUNDE ${appState.week}`;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===appState.page));let pages={home,squad,tactics,transfers,league};document.getElementById("app").innerHTML=pages[appState.page]();save()}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));
document.getElementById("saveBtn").addEventListener("click",()=>{save();let b=document.getElementById("saveBtn");b.textContent="✓ Lagret";setTimeout(()=>b.textContent="▣ Lagre",1200)});
if(!load()){init()}else{render()}
</script>
</body></html>
