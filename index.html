const AI_SQUAD_TARGETS={GK:3,DEF:8,MID:8,ATT:6};
function aiPosGroup(p){const x=String(p?.pos||p?.position||'').toUpperCase();if(x==='GK'||x.includes('KEEP'))return 'GK';if(['DEF','CB','LB','RB','LWB','RWB'].includes(x)||x.includes('DEF'))return 'DEF';if(['MID','DM','CM','AM','LM','RM','CAM','CDM'].includes(x)||x.includes('MID'))return 'MID';return 'ATT';}
function aiSquadCounts(squad){const c={GK:0,DEF:0,MID:0,ATT:0};for(const p of squad||[])c[aiPosGroup(p)]++;return c;}
function aiSquadNeeds(squad){const c=aiSquadCounts(squad);return Object.fromEntries(Object.entries(AI_SQUAD_TARGETS).map(([k,n])=>[k,n-c[k]]));}
function processAILeagueTransfers(week=appState.week){
 if(!transferWindowOpen(week))return [];
 if(!Array.isArray(appState.worldSquads))appState.worldSquads=[];
 if(!Array.isArray(appState.transferHistory))appState.transferHistory=[];
 const moved=[];const clubCount=Math.min(CLUBS.length,appState.worldSquads.length||CLUBS.length);
 // Several independent moves per open-window gameweek; position shortages drive recruitment.
 const attempts=3+Math.floor(seededRandom(stableSeed('ai-window-'+seasonLabel()+'-'+week))()*3);
 for(let n=0;n<attempts;n++){
  const needs=Array.from({length:clubCount},(_,i)=>({i,counts:aiSquadCounts(appState.worldSquads[i]||[]),need:aiSquadNeeds(appState.worldSquads[i]||[])}));
  const buyers=needs.filter(x=>x.i!==Number(appState.club)&&Object.values(x.need).some(v=>v>0)&&Number(CLUBS[x.i]?.budget??10)>0);
  if(!buyers.length)break;
  const rng=seededRandom(stableSeed('ai-move-'+seasonLabel()+'-'+week+'-'+n));
  // Weight clubs with bigger gaps, while allowing smaller clubs to make sensible signings too.
  const buyer=buyers.sort((a,b)=>Object.values(b.need).reduce((s,v)=>s+Math.max(0,v),0)-Object.values(a.need).reduce((s,v)=>s+Math.max(0,v),0))[Math.floor(rng()*Math.min(4,buyers.length))];
  const posChoices=Object.entries(buyer.need).filter(([k,v])=>v>0).map(([k,v])=>k);if(!posChoices.length)continue;
  const pos=posChoices[Math.floor(rng()*posChoices.length)];
  const sellers=needs.filter(x=>x.i!==buyer.i&&x.i!==Number(appState.club)&&(x.counts[pos]>AI_SQUAD_TARGETS[pos]||((appState.worldSquads[x.i]||[]).length>25&&x.counts[pos]>=AI_SQUAD_TARGETS[pos])));
  if(!sellers.length)continue;
  const seller=sellers[Math.floor(rng()*sellers.length)];
  const squad=appState.worldSquads[seller.i]||[];
  const candidates=squad.map((p,idx)=>({p,idx})).filter(x=>aiPosGroup(x.p)===pos).sort((a,b)=>{
   const ar=Number(a.p.rating||55),br=Number(b.p.rating||55);const starA=ar>=(CLUBS[seller.i]?.strength||65)+3?1:0,starB=br>=(CLUBS[seller.i]?.strength||65)+3?1:0;return starA-starB||ar-br;
  });
  if(!candidates.length)continue;
  // Sell fringe/overstock players first; rarely move a club's best player.
  const pool=candidates.slice(0,Math.max(1,Math.ceil(candidates.length*.45)));const chosen=pool[Math.floor(rng()*pool.length)];const p=chosen.p;
  const value=Math.max(.2,Number(p.value)||(((Number(p.rating||55)-45)**2)/100));
  const statusGap=Number(CLUBS[buyer.i]?.strength||60)-Number(CLUBS[seller.i]?.strength||60);
  const price=+(value*(statusGap>8?1.12:statusGap< -8?1.32:1.2)*(Number(p.age||25)<22?1.12:1)).toFixed(1);
  const buyerBudget=Number(CLUBS[buyer.i]?.budget??price*2);
  if(buyerBudget<price*.6)continue;
  const actualFee=Math.min(price,Math.max(.2,buyerBudget));
  const [out]=squad.splice(chosen.idx,1);if(!out)continue;
  const incoming={...out,id:`AI-${seasonLabel()}-${week}-${buyer.i}-${String(out.id)}`,clubIndex:buyer.i,fitness:Number(out.fitness??90),morale:Math.max(55,Number(out.morale??70))};
  if(!Array.isArray(appState.worldSquads[buyer.i]))appState.worldSquads[buyer.i]=[];appState.worldSquads[buyer.i].push(incoming);
  appState.transferHistory.push({type:'ai',playerName:out.name,from:CLUBS[seller.i]?.name||'Ukjent klubb',to:CLUBS[buyer.i]?.name||'Ukjent klubb',fee:actualFee,week,position:pos});
  moved.push({playerName:out.name,from:seller.i,to:buyer.i,fee:actualFee,position:pos});
  if(!Array.isArray(appState.aiTransferActivity))appState.aiTransferActivity=[];appState.aiTransferActivity.push({playerName:out.name,from:CLUBS[seller.i]?.name,to:CLUBS[buyer.i]?.name,fee:actualFee,week,season:seasonLabel(),position:pos});
  if(appState.aiTransferActivity.length>500)appState.aiTransferActivity=appState.aiTransferActivity.slice(-500);
 }
 if(moved.length)appState.log.push(`${moved.length} AI-overganger ble gjennomført i ligaen denne gameweeken.`);
 return moved;
}

function aiBuyerFitForPlayer(buyerIndex,p){
 const club=CLUBS[buyerIndex];if(!club)return {ok:false,reason:'missing-club'};
 const squad=appState.worldSquads?.[buyerIndex]||[];
 const group=aiPosGroup(p);
 const same=squad.filter(x=>aiPosGroup(x)===group);
 const target=AI_SQUAD_TARGETS[group]||6;
 const needs=aiSquadNeeds(squad);
 const rating=Number(p.rating)||0;
 const strength=Number(club.strength)||60;
 const weakest=same.length?Math.min(...same.map(x=>Number(x.rating)||0)):0;
 // A signing must be credible for the buyer's level and either fill a shortage
 // or improve the quality of the club's existing options in that position.
 const qualityFloor=strength-7;
 const improvesDepth=same.length<target || rating>=weakest+2;
 return {ok:rating>=qualityFloor&&improvesDepth,group,needs:needs[group]||0,weakest,qualityFloor,improvesDepth};
}
function processAITransferOffers(week=appState.week){
 if(!transferWindowOpen(week))return [];
 if(!Array.isArray(appState.transferOffers))appState.transferOffers=[];
 if(!Array.isArray(appState.listedForTransfer))appState.listedForTransfer=[];
 const pending=new Set(appState.transferOffers.filter(o=>o.status==='pending').map(o=>String(o.playerId)));
 const created=[];const userClub=CLUBS[appState.club];
 if(!userClub)return created;
 const divisionRank={'Premier League':0,'Championship':1,'League One':2,'League Two':3};
 const sellerDivision=clubDivision(userClub);const sellerRank=divisionRank[sellerDivision]??0;
 for(const p of appState.squad){
  if(!p||!p.name||pending.has(String(p.id)))continue;
  const listed=appState.listedForTransfer.includes(String(p.id));
  const rating=Number(p.rating)||0;
  const star=rating>=Number(userClub.strength||65)+2;
  const morale=Number(p.morale??70);
  // Listing raises interest, but does not make a player attractive to a club
  // whose squad level is far above his ability.
  const base=listed?.38:(star?.003:.012);
  if(Math.random()>base)continue;
  const value=Number(p.value)||Math.max(.2,((rating-45)**2)/100);
  const estimatedAsk=value*(star?1.55:1.18)*(listed?.96:1.08)*(Number(p.age)<22?1.12:Number(p.age)>30?.82:1);
  const buyers=CLUBS.map((c,i)=>({...c,index:i,rank:divisionRank[clubDivision(c)]??3,fit:aiBuyerFitForPlayer(i,p)})).filter(c=>{
   if(c.index===Number(appState.club)||Number(c.budget)<=0||!c.fit.ok)return false;
   // One division down is entirely possible when the player improves that squad.
   // Avoid implausible jumps to a top club for a player below its normal level.
   const tierGap=c.rank-sellerRank;
   if(tierGap>2)return false;
   if(c.rank===0&&Number(c.strength||0)>rating+7)return false;
   const expectedBid=estimatedAsk*(listed?.86:.72);
   return Number(c.budget)>=expectedBid;
  });
  if(!buyers.length)continue;
  // Prefer clubs at a similar level. Stronger clubs are not automatically favoured;
  // a lower-division club can win the bid if the player genuinely improves its squad.
  const score=c=>{
   const levelGap=Math.abs(Number(c.strength||60)-rating);
   const sameTier=c.rank===sellerRank?2:0;
   const need=Math.max(0,Number(c.fit.needs)||0);
   return need*3+sameTier-levelGap*.45+(c.rank>sellerRank?1:0);
  };
  buyers.sort((a,b)=>score(b)-score(a));
  const top=buyers.slice(0,Math.min(4,buyers.length));
  const buyer=top[Math.floor(Math.random()*top.length)];
  const statusGap=Number(buyer.strength||60)-Number(userClub.strength||60);
  const resistance=star?(statusGap>=8?1.32:1.72):(statusGap>=8?1.08:1.24);
  const ask=+(value*resistance*(listed?.96:1.08)*(Number(p.age)<22?1.12:Number(p.age)>30?.82:1)).toFixed(1);
  const bid=+(ask*(listed?.86:.72)*(statusGap>=10?1.08:1)).toFixed(1);
  const offer={id:'OFFER-'+Date.now()+'-'+Math.floor(Math.random()*100000),playerId:String(p.id),playerName:p.name,buyerIndex:buyer.index,buyerName:buyer.name,amount:Math.max(.1,bid),asking:ask,week,status:'pending',listed,star,createdAt:Date.now()};
  appState.transferOffers.push(offer);created.push(offer);pending.add(String(p.id));
  appState.log.push(`${buyer.name} har lagt inn bud på ${p.name}: ${money(offer.amount)}${listed?' etter at spilleren ble lagt ut for salg':''}.`);
 }
 return created;
}
function respondTransferOffer(offerId,action){
 const o=(appState.transferOffers||[]).find(x=>x.id===offerId&&x.status==='pending');if(!o)return;
 const p=appState.squad.find(x=>String(x.id)===String(o.playerId));if(!p){o.status='expired';save();render();return;}
 if(action==='reject'){o.status='rejected';appState.log.push(`Budet fra ${o.buyerName} på ${p.name} ble avslått.`);}
 else if(action==='counter'){o.counter=+(Math.max(o.asking,o.amount*1.18)).toFixed(1);if(Math.random()<Math.min(.82,o.amount/o.counter*.72)){o.amount=o.counter;o.status='pending';o.countered=true;appState.log.push(`${o.buyerName} godtar motkravet på ${money(o.counter)} for ${p.name}. Du kan nå godta eller avslå budet.`);}else{o.status='rejected';appState.log.push(`${o.buyerName} avslo motkravet på ${money(o.counter)} for ${p.name}.`);}}
 else if(action==='accept'){
  const buyer=CLUBS[o.buyerIndex];const fromList=appState.listedForTransfer||[];
  appState.budget=+(Number(appState.budget||0)+o.amount).toFixed(1);
  appState.squad=appState.squad.filter(x=>String(x.id)!==String(p.id));
  if(Array.isArray(appState.worldSquads?.[appState.club]))appState.worldSquads[appState.club]=appState.worldSquads[appState.club].filter(x=>String(x.id)!==String(p.id));
  if(!Array.isArray(appState.worldSquads[o.buyerIndex]))appState.worldSquads[o.buyerIndex]=[];
  appState.worldSquads[o.buyerIndex].push({...p,clubIndex:o.buyerIndex,fitness:p.fitness??90,morale:Math.min(85,p.morale??70),id:'AI-'+Date.now()+'-'+Math.floor(Math.random()*10000)});
  appState.listedForTransfer=fromList.filter(x=>x!==String(p.id));o.status='accepted';
  appState.transferHistory=appState.transferHistory||[];appState.transferHistory.push({type:'sale',playerName:p.name,from:(CLUBS[appState.club]?.name||currentClub().name),to:buyer.name,fee:o.amount,week:o.week});
  appState.log.push(`${p.name} solgt til ${buyer.name} for ${money(o.amount)}. Pengene er lagt til overgangsbudsjettet.`);appState.notice=`Overgang fullført: ${p.name} er solgt til ${buyer.name} for ${money(o.amount)}.`;
 }
 save();render();
}

function processCareerAgeing(){
 const season=Number(appState.seasonYear)||2026;
 const retired=[]; const declined=[];
 function agePlayer(p,clubLabel,isUser){
  if(!p||!p.name)return true;
  p.age=Math.max(16,Number(p.age||24)+1);
  const age=p.age, pos=p.pos||'MID';
  // Development before prime; natural decline is gradual and varies by position.
  const rng=seededRandom(stableSeed(`${p.name}|ageing|${season}|${clubLabel}`));
  const peak=pos==='GK'?31:pos==='DEF'?29:pos==='MID'?28:27;
  const potential=Number(p.potential||p.rating||60);
  const rating=Number(p.rating||60);
  if(age<=22 && rating<potential && rng()<(.22+(potential-rating)*.012)){
    p.rating=Math.min(potential,rating+(rng()<.18?2:1));
  }else if(age>peak){
    const years=age-peak;
    const chance=Math.min(.82,.13+years*.075+(pos==='GK'?-0.08:0));
    if(rng()<chance){
      const fall=age>=35&&rng()<.22?2:1;
      p.rating=Math.max(25,rating-fall);
      if(p.rating<rating)declined.push(`${p.name} (${clubLabel})`);
    }
  }
  // Value falls as age rises, even when rating is maintained.
  const ageFactor=age<=22?1.12:age<=27?1:age<=30?.86:age<=33?.65:age<=35?.42:.25;
  p.value=Math.max(.05,+((Math.max(1,p.rating-40)**2/120)*ageFactor).toFixed(2));
  // Retirement risk grows after 34; keep goalkeepers active longer on average.
  const retirementAge=pos==='GK'?38:35;
  const yearsOver=age-retirementAge;
  const retireChance=yearsOver<0?0:Math.min(.78,.10+yearsOver*.16);
  if(age>=retirementAge && rng()<retireChance){retired.push(`${p.name} (${clubLabel}, ${age} år)`);return false;}
  return true;
 }
 appState.squad=(appState.squad||[]).filter(p=>agePlayer(p,currentClub().name,true));
 (appState.worldSquads||[]).forEach((roster,ci)=>{
   const club=CLUBS[ci]?.name||`Klubb ${ci+1}`;
   appState.worldSquads[ci]=(roster||[]).filter(p=>agePlayer(p,club,false));
 });
 // Ensure the user's squad does not become unusable after retirements.
 const counts=aiSquadCounts(appState.squad||[]);
 const targets={GK:3,DEF:8,MID:8,ATT:6};
 Object.entries(targets).forEach(([pos,target])=>{
  while((counts[pos]||0)<target){
   const n=(appState.squad.filter(p=>p.pos===pos).length)+1;
   const rating=Math.max(48,Math.min(75,(currentClub().strength||60)-7+Math.floor(Math.random()*9)));
   const p={id:`regen-${season}-${pos}-${n}-${Date.now()}`,name:`Academy Promotion ${season} ${pos} ${n}`,pos,role:defaultRoleFor(`regen-${season}-${pos}-${n}`,pos,n),naturalPositions:[pos],age:18+Math.floor(Math.random()*5),rating,potential:Math.min(94,rating+8+Math.floor(Math.random()*12)),attributes:generateAttributes(pos,rating),value:Math.max(.2,+((rating-40)**2/120).toFixed(1)),wage:Math.max(2,Math.round((rating-40)*.8)),fitness:90,morale:70,form:6.5,goals:0,assists:0,apps:0,minutes:0,injured:0,suspended:0,clubIndex:appState.club,source:'Academy replacement'};
   appState.squad.push(p);counts[pos]=(counts[pos]||0)+1;
  }
 });
 // Keep AI squads viable after retirement: promote a generic reserve only if a position falls below target.
 (appState.worldSquads||[]).forEach((roster,ci)=>{
   const club=CLUBS[ci]; if(!club)return;
   const counts=aiSquadCounts(roster||[]); const targets={GK:3,DEF:8,MID:8,ATT:6};
   Object.entries(targets).forEach(([pos,target])=>{while((counts[pos]||0)<target){const n=(roster||[]).filter(p=>p.pos===pos).length+1;const rating=Math.max(42,Math.min(78,club.strength-8+Math.floor(Math.random()*13)));roster.push({id:`regen-ai-${season}-${ci}-${pos}-${n}`,name:`Academy Prospect ${season} ${pos} ${n}`,pos,role:defaultRoleFor(`${club.name}-${pos}-${n}`,pos,n),naturalPositions:[pos],age:17+Math.floor(Math.random()*5),rating,potential:Math.min(95,rating+8+Math.floor(Math.random()*15)),attributes:generateAttributes(pos,rating),value:Math.max(.1,+((rating-38)**2/130).toFixed(1)),wage:Math.max(1,Math.round((rating-42)*.65)),fitness:90,morale:70,form:6.5,goals:0,assists:0,apps:0,minutes:0,clubIndex:ci,source:'Academy replacement'});counts[pos]=(counts[pos]||0)+1;}});
 });
 appState.log.push(`Aldersoppdatering: ${declined.length} spillere fikk redusert ferdighet${declined.length===1?'':'er'}; ${retired.length} la opp.`);

function maybeManagerTactics(engine,minute){
 // Evaluate at regular late-match checkpoints; a one-goal deficit must count as urgent.
 if(![60,65,70,75,80,85,90].includes(minute))return;

  const current=managerSideFormation(engine,side);let desired=current,tactic=isUser?appState.tactic:(engine.sideTactics?.[side]||'Balanced'),reason='';
  const staminaAvg=xi.length?xi.reduce((n,p)=>n+matchStamina(engine,p),0)/xi.length:75;

  if(mode==='needed'){

   if(diff<0&&minute>=75){desired=current==='3-5-2'?'4-2-3-1':current==='4-2-3-1'?'4-3-3':'4-2-3-1';tactic='Attacking';reason=diff<=-2?'Ligger under med minst to mål sent – går tydeligere offensivt':'Ligger under sent i kampen – øker risikoen for å jakte utligning';}

   else if(diff>=2&&minute>=80){desired=current==='4-3-3'?'4-2-3-1':current;tactic='Defensive';reason='Leder komfortabelt sent i kampen – beskytter ledelsen';}
   else if(staminaAvg<48&&minute>=70){tactic='Balanced';reason='Svært lav utholdenhet i laget – reduserer intensiteten';}

  } else {
   if(diff<0&&minute>=60){desired=current==='4-3-3'?'4-2-3-1':'4-3-3';tactic='Attacking';reason='Ligger under – øker risikoen';}
   else if(diff>0&&minute>=75){desired=current==='4-3-3'?'4-2-3-1':'4-3-3';tactic='Defensive';reason='Leder – forsøker å kontrollere kampen';}

   const commentary=document.getElementById('liveCommentary');if(commentary)commentary.textContent=`Assistentens forslag: ${reason.toLowerCase()}. Vurder ${desired} og ${tactic==='Attacking'?'offensiv':tactic==='Defensive'?'defensiv':'balansert'} mentalitet.`;

 }
}

function advanceLiveEngine(engine,minute){
 const events=[];engine.minute=minute;
 // Match stamina falls gradually; pressing and high-tempo tactics cost more energy.
 for(const side of ["A","B"]){
  const xi=side==="A"?engine.xiA:engine.xiB;
  const isUser=(side==="A"?engine.a:engine.b)===appState.club;
  const tactic=isUser?appState.tactic:(engine.sideTactics?.[side]||'Balanced');
  const pressCost=tactic==="High press"?.22:tactic==="Attacking"?.15:tactic==="Defensive"?.075:.11;
  for(const p of xi){
   const id=String(p.id);
   const posCost=p.pos==="MID"?.105:p.pos==="ATT"?.12:p.pos==="DEF"?.075:.045;
   const endurance=Number(p.attributes?.stamina??p.rating??65);
   const enduranceRelief=clamp((endurance-65)*.0018,-.025,.045);
   const role=p.assignedRole||p.role||'';
   const roleWorkload=['LW','RW','LWB','RWB','LM','RM'].includes(role)?.035:0;
   engine.stamina[id]=clamp((engine.stamina[id]??playerFitnessValue(p))-pressCost-posCost-roleWorkload+enduranceRelief-(Math.random()*.035),32,100);
   const perf=engine.performance[id];if(perf)perf.influence+=effectivePlayerRating(engine,p)/100;
  }
 }
 // Recalculate ratings every minute so fatigue, morale, form and substitutions alter the balance.
 recomputeLiveTeam(engine,"A");recomputeLiveTeam(engine,"B");
 const attackA=engine.baseAttackA+liveTacticDelta(engine,"A");
 const attackB=engine.baseAttackB+liveTacticDelta(engine,"B");
 const diff=(attackA-engine.defenseB)-(attackB-engine.defenseA);
 const probA=clamp(.5+diff*.012,.2,.8);
 const chances=(Math.random()<.22?1:0)+(Math.random()<.025?1:0);
 const scorerFor=(xi,side)=>{
  const candidates=xi.filter(p=>p.pos==="ATT"||p.pos==="MID");
  if(!candidates.length)return {name:"Spiller",id:null};
  const weights=candidates.map(p=>Math.max(1,effectivePlayerRating(engine,p)-42)*roleWeight(p,"attack",side==="A"?engine.formationA:engine.formationB));
  const chosen=weightedPick(candidates,weights);
  return chosen?{name:chosen.name,id:chosen.id}:{name:"Spiller",id:null};
 };
 const assistFor=(xi,id,side)=>{const candidates=xi.filter(p=>p.id!==id&&(p.pos==="MID"||p.pos==="ATT"));const p=weightedPick(candidates,candidates.map(x=>Math.max(1,effectivePlayerRating(engine,x)-42)));return p?.name||null};
 for(let i=0;i<chances;i++){
  const side=Math.random()<probA?"A":"B";
  const xi=side==="A"?engine.xiA:engine.xiB;
  const opponentXi=side==="A"?engine.xiB:engine.xiA;
  const keeper=opponentXi.find(p=>p.pos==="GK");
  const keeperRating=keeper?effectivePlayerRating(engine,keeper):65;
  const attackers=xi.filter(p=>p.pos==="ATT"||p.pos==="MID");
  const formation=side==="A"?engine.formationA:engine.formationB;
  const shooter=weightedPick(attackers,attackers.map(p=>Math.max(1,effectivePlayerRating(engine,p)-42)*roleWeight(p,"attack",formation)));
  const finishing=shooter?effectivePlayerRating(engine,shooter):65;
  const teamAttack=side==="A"?attackA:attackB, opponentDefense=side==="A"?engine.defenseB:engine.defenseA;
  const quality=clamp(.14+(teamAttack-opponentDefense)*.005+(finishing-65)*.003+Math.random()*.14,.035,.52);
  const onTarget=Math.random()<clamp(.31+(finishing-60)*.012,.16,.82);
  if(side==="A"){engine.stats.shotsA++;if(onTarget)engine.stats.onA++}else{engine.stats.shotsB++;if(onTarget)engine.stats.onB++}
  const event={minute,side,type:"chance",player:shooter?.name||"Angriper",playerId:shooter?.id||null,onTarget,quality:+quality.toFixed(2)};
  if(shooter&&engine.performance[String(shooter.id)])engine.performance[String(shooter.id)].shots++;
  const keeperSave=clamp(.32+(keeperRating-65)*.012,.08,.72);
  if(onTarget&&Math.random()<quality*(1-keeperSave)*1.35){
   const scorer=shooter?{name:shooter.name,id:shooter.id}:scorerFor(xi,side);
   if(side==="A")engine.ga++;else engine.gb++;
   event.type="goal";event.scorer=scorer.name;event.scorerId=scorer.id;event.assist=assistFor(xi,scorer.id,side);event.score=`${engine.ga}–${engine.gb}`;
   if(scorer.id!=null&&engine.performance[String(scorer.id)])engine.performance[String(scorer.id)].goals++;
   if(event.assist){const assister=xi.find(p=>p.name===event.assist);if(assister&&engine.performance[String(assister.id)])engine.performance[String(assister.id)].assists++}
  }
  engine.events.push(event);events.push(event);
 }
 if(Math.random()<.008){
  const side=Math.random()<probA?"A":"B",xi=side==="A"?engine.xiA:engine.xiB;
  const candidates=xi.filter(p=>p.pos!=="GK"),p=weightedPick(candidates,candidates.map(x=>Math.max(1,100-effectivePlayerRating(engine,x))));
  const e={minute,side,type:"yellow",player:p?.name||"Spiller",playerId:p?.id||null,reason:"Forseelse"};engine.events.push(e);events.push(e);
 }
 if(Math.random()<.0007){
  const side=Math.random()<probA?"A":"B",xi=side==="A"?engine.xiA:engine.xiB;
  const candidates=xi.filter(p=>p.pos!=="GK"),p=weightedPick(candidates,candidates.map(x=>Math.max(1,100-effectivePlayerRating(engine,x))));
  const e={minute,side,type:"red",player:p?.name||"Spiller",playerId:p?.id||null,reason:"Alvorlig forseelse"};engine.events.push(e);events.push(e);
 }
 if(Math.random()<.002){
  const side=Math.random()<probA?"A":"B",xi=side==="A"?engine.xiA:engine.xiB;
  const candidates=xi.filter(p=>p.pos!=="GK"),p=weightedPick(candidates,candidates.map(x=>Math.max(1,100-effectivePlayerRating(engine,x))));
  const e={minute,side,type:"injury",player:p?.name||"Spiller",playerId:p?.id||null,reason:"Skade"};engine.events.push(e);events.push(e);
 }
 const targetPoss=clamp(50+(attackA-attackB)*.6,30,70);
 engine.stats.possessionA=clamp(Math.round(engine.stats.possessionA*.72+targetPoss*.28+(Math.random()*4-2)),30,70);
 return events;
}
function recordSimulatedPlayerStats(clubA,clubB,playersA,playersB,sim){
 const update=(clubIndex,players,side)=>{
  const roster=appState.worldSquads?.[clubIndex];if(!roster)return;
  const chosen=players.filter(p=>sim.xiA.concat(sim.xiB).some(x=>String(x.id)===String(p.id)));
  chosen.forEach(p=>{const target=roster.find(x=>x.name===p.name);if(!target)return;target.apps=(target.apps||0)+1;target.minutes=(target.minutes||0)+90;});
  (sim.chanceList||[]).filter(e=>e.side===side).forEach(e=>{if(e.type==='goal'){const scorer=roster.find(p=>p.name===e.scorer);if(scorer)scorer.goals=(scorer.goals||0)+1;if(e.assist){const assister=roster.find(p=>p.name===e.assist);if(assister)assister.assists=(assister.assists||0)+1;}}else{const creator=roster.find(p=>p.name===e.player);if(creator)creator.chancesCreated=(creator.chancesCreated||0)+1;}});
  sim.events.filter(e=>e.type==='yellow'||e.type==='red').forEach(e=>{if(e.side!==side)return;const p=weightedPick(chosen,chosen.map(x=>Math.max(1,x.attributes?.defending||50)));if(p){const target=roster.find(x=>x.name===p.name);if(target){if(e.type==='yellow')target.yellowCards=(target.yellowCards||0)+1;else target.redCards=(target.redCards||0)+1;}}});
 };
 update(clubA,playersA,'A');update(clubB,playersB,'B');
}
